name: Build and publish desktop prereleases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every push to main publishes a prerelease, but the updater only offers a
  # build whose version is strictly higher than the installed one - so a push
  # that does not move the version ships an artifact nobody can install. This
  # job decides the number once; the build jobs write it into their own
  # checkout, and `bump` commits it back only after every one of them passed,
  # so a failed build does not burn a version.
  version:
    name: Next version
    runs-on: ubuntu-22.04
    outputs:
      next: ${{ steps.pick.outputs.next }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          set -euo pipefail
          current=$(sed -n 's/^version = "\([0-9.]*\)".*/\1/p' app/src-tauri/Cargo.toml | head -1)
          if [ -z "$current" ]; then echo "could not read the current version" >&2; exit 1; fi
          IFS=. read -r major minor patch <<< "$current"
          next="$major.$minor.$((patch + 1))"
          echo "$current -> $next"
          echo "next=$next" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows NSIS installer
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable

      - name: Install LLVM for bindgen
        shell: pwsh
        run: choco install llvm --no-progress --yes

      - name: Download shared FFmpeg
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.zip'
          $extract = Join-Path $env:RUNNER_TEMP 'ffmpeg'
          # Pin both source archive and digest: ffmpeg-sys-next 9's bindgen
          # shim is compatible with this FFmpeg 8.1 header set, unlike a
          # moving BtbN master snapshot.
          $expectedSha256 = '274923c68904a9b76c73b908f57923dafba81155856cd742138515ded570d066'
          Invoke-WebRequest `
            -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build-shared.zip' `
            -OutFile $archive
          $actualSha256 = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg archive SHA-256 mismatch: $actualSha256"
          }
          Expand-Archive -Path $archive -DestinationPath $extract
          $ffmpeg = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if ($null -eq $ffmpeg) { throw 'shared FFmpeg archive had no root directory' }
          $libclang = Get-ChildItem -Path 'C:\Program Files\LLVM' -Recurse -Filter libclang.dll |
            Select-Object -First 1
          if ($null -eq $libclang) { throw 'LLVM installation did not provide libclang.dll' }
          "FFMPEG_DIR=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LIBCLANG_PATH=$($libclang.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Stage DirectML redistributable
        shell: pwsh
        run: |
          $version = '1.15.4'
          $archive = Join-Path $env:RUNNER_TEMP "Microsoft.AI.DirectML.$version.nupkg"
          $extract = Join-Path $env:RUNNER_TEMP 'directml'
          Invoke-WebRequest `
            -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/$version/microsoft.ai.directml.$version.nupkg" `
            -OutFile $archive
          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          tar -xf $archive -C $extract
          $source = Join-Path $extract 'bin\x64-win\DirectML.dll'
          if (-not (Test-Path -LiteralPath $source)) {
            throw 'Microsoft.AI.DirectML did not contain bin/x64-win/DirectML.dll'
          }
          $destination = Join-Path $env:GITHUB_WORKSPACE 'app\src-tauri\target\release'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination -Force

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      # After `bun install`, so a version this run invented can never look like
      # a lockfile mismatch. Cargo.toml is the only file holding the version:
      # tauri.conf.json omits it and falls back to this one.
      - name: Stamp the build version
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.next }}"/' app/src-tauri/Cargo.toml
          sed -n '1,10p' app/src-tauri/Cargo.toml

      # AIDRONE_COPILOT_KEY is the demo key baked into published builds so the
      # copilot answers on a fresh machine with nothing configured. It is a
      # repository secret, never a literal in this tree: a key committed to a
      # public repo is revoked by secret scanning before the demo runs. An
      # unset secret simply produces a build with no key, which still takes
      # COPILOT_API_KEY or the per-user key file.
      - name: Build NSIS installer
        working-directory: app
        env:
          AIDRONE_COPILOT_KEY: ${{ secrets.AIDRONE_COPILOT_KEY }}
        run: bun run tauri build --bundles nsis

      - name: Verify installer wiring
        working-directory: app
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File src-tauri/installer/windows/verify-nsis.ps1

      - name: Collect Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: app/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  ubuntu:
    name: Ubuntu ${{ matrix.version }} packages
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            version: "22.04"
            release: ubuntu22
          - runner: ubuntu-24.04
            version: "24.04"
            release: ubuntu24
          - runner: ubuntu-26.04
            version: "26.04"
            release: ubuntu26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libasound2-dev clang libclang-dev cmake \
            build-essential pkg-config libssl-dev libavcodec-dev libavformat-dev \
            libavutil-dev libswresample-dev libswscale-dev

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      # Same stamp as the Windows job, from the same single output, so all four
      # artifacts of one run carry one version.
      - name: Stamp the build version
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/^version = ".*"/version = "${{ needs.version.outputs.next }}"/' app/src-tauri/Cargo.toml
          sed -n '1,10p' app/src-tauri/Cargo.toml

      - name: Build release-specific Debian package
        working-directory: app
        env:
          AIDRONE_COPILOT_KEY: ${{ secrets.AIDRONE_COPILOT_KEY }}
        run: bash src-tauri/installer/linux/build-deb.sh


      - name: Stage version-labelled Ubuntu packages
        working-directory: app
        shell: bash
        run: |
          mkdir -p release-assets
          for artifact in src-tauri/target/release/bundle/deb/*.deb; do
            name=$(basename "$artifact" .deb)
            cp "$artifact" "release-assets/${name}_${{ matrix.release }}.deb"
          done

      - name: Collect Ubuntu packages
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-${{ matrix.release }}-packages
          path: app/release-assets/*
          if-no-files-found: error

  publish:
    name: Publish GitHub prerelease
    needs: [windows, ubuntu]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: release-assets

      - name: Publish commit build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.sha }}
          name: Continuous build ${{ github.sha }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          make_latest: false
          files: release-assets/**/*
          fail_on_unmatched_files: true

      - name: Remove unsupported AppImage assets
        uses: actions/github-script@v7
        with:
          script: |
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const assets = releases.flatMap((release) =>
              release.assets.filter((asset) => asset.name.endsWith(".AppImage")),
            );
            for (const asset of assets) {
              core.info(`Deleting unsupported release asset ${asset.name} (${asset.id})`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id,
              });
            }

  bump:
    name: Record the published version
    needs: [version, publish]
    # Only for pushes to main. A `workflow_dispatch` rebuild of an older commit
    # must not move main's version to a number that commit never shipped.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Commit the version this run published
        shell: bash
        env:
          NEXT: ${{ needs.version.outputs.next }}
        run: |
          set -euo pipefail
          sed -i "s/^version = \".*\"/version = \"$NEXT\"/" app/src-tauri/Cargo.toml
          # Cargo.lock records the crate's own version too, so leaving it behind
          # hands the next developer a dirty lockfile the first build rewrites.
          awk -v want="$NEXT" '
            /^name = "app"$/ { pending = 1 }
            pending && /^version = / { sub(/"[^"]*"/, "\"" want "\""); pending = 0 }
            { print }
          ' app/src-tauri/Cargo.lock > Cargo.lock.next
          mv Cargo.lock.next app/src-tauri/Cargo.lock
          if git diff --quiet; then echo "already at $NEXT"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src-tauri/Cargo.toml app/src-tauri/Cargo.lock
          # [skip ci] is what stops this from triggering itself forever.
          git commit -m "Release $NEXT [skip ci]"
          # Someone may have pushed while the build ran; rebase rather than
          # force, so their commit is never the one that disappears.
          for attempt in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep 5
          done
          exit 1