; AIdrone - ESP32-S3 USB-NCM bridge, measurement build
;
; The ESP32-S3 owns the Tello's radio (soft-AP "<deployment Soft-AP>") and hands the
; laptop a real Ethernet NIC over USB-C. No cloud, no WebSocket, no re-framing:
; Tello UDP datagrams cross to the host as Ethernet frames and land in a plain
; UDP socket.
;
; USB class is CDC-NCM. That is the only network class that is in-box on BOTH
; targets we support: Windows 11 (UsbNcm.sys) and Ubuntu (cdc_ncm). ECM has no
; in-box Windows driver; RNDIS is being pushed out of modern Linux.
;
; Board: ESP32-S3-DevKitC-1 with an N16R8 module. Verified hardware:
; ESP32-S3 rev v0.2, 16 MB quad flash, and 8 MB embedded octal PSRAM.
; A LOLIN S3 Mini lacks a UART bridge and is not interchangeable here.
;
; THE DEVKITC HAS TWO USB-C PORTS. The one marked "UART" (CH343) only flashes
; and prints; the data plane in this project is the one marked "USB", wired to
; the S3's native USB-OTG pins. Both must be plugged in for the bench to run.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The stock definition is the N8 variant (8 MB flash, no PSRAM).
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; 16 MB quad flash + OCTAL PSRAM. Without the opi half the bootloader cannot
; handshake the PSRAM and the board crash-loops before app code runs.
board_build.arduino.memory_type = qio_opi

; --- Custom variant: USB PID only -------------------------------------------
; variants/aidrone_s3/pins_arduino.h is the stock esp32s3 variant with USB_PID
; changed from 0x1001 to 0x8AD1. Reason, in full, at the top of that file: a
; Zadig/libwdi INF (usb_jtag_debug_unit.inf) claims the hardware id
; USB\VID_303A&PID_1001&MI_02 for WinUSB, which outranks the compatible-id
; match Microsoft's in-box usbncm.inf uses -- so on any machine that has ever
; had OpenOCD JTAG set up, WinUSB steals our NCM function and no Ethernet
; adapter appears. The PID is the only lever that works from inside the build:
; the stock header defines USB_PID unguarded ahead of USB.cpp's #ifndef, and
; USB.begin() runs in app_main() before setup(), so neither -DUSB_PID nor a
; runtime USB.PID() call can win.
board_build.variants_dir = variants
board_build.variant = aidrone_s3

monitor_speed = 115200
upload_speed = 921600

; --- USB stack selection ----------------------------------------------------
; The board definition hardcodes ARDUINO_USB_MODE=1 (USB-Serial-JTAG), which
; leaves the USB-OTG controller idle and makes TinyUSB unreachable. Drop it.
build_unflags = -DARDUINO_USB_MODE=1

build_flags =
	; 0 = TinyUSB on the USB-OTG controller (required for NCM).
	-DARDUINO_USB_MODE=0
	; Give us a TinyUSB CDC console on the SAME cable. USBCDC's constructor
	; reserves OUT3/IN4/IN5; NCM then takes notif IN 0x83 and bulk 0x81/0x01,
	; for 4 active IN endpoints against the core's limit of 5. It fits.
	-DARDUINO_USB_CDC_ON_BOOT=1
	; NOTE: this also makes the core call USB.begin() -> tinyusb_init() from
	; app_main(), BEFORE setup(). -DARDUINO_USB_ON_BOOT=0 cannot stop that --
	; USB.h:25 redefines the macro unguarded. src/ncm.cpp therefore registers
	; the NCM interface from a global constructor, which runs earlier still.
	-DCORE_DEBUG_LEVEL=1

; Reflashing note: once this firmware runs, the device enumerates as a TinyUSB
; composite (CDC + NCM), not as USB-Serial-JTAG. USB persist-reset is disabled
; in the core for this interface combination, so if the upload port does not
; auto-reset, hold BOOT and tap RESET to enter the ROM bootloader.
